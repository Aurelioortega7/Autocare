<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AutoCare</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="header-content">

        <img
            src="autocare-logo.png"
            alt="AutoCare"
            class="logo"
        >

        <div class="header-text">
            <h1>AutoCare</h1>
            <p>Gestión de vehículos y mantenimientos</p>
        </div>

    </div>
</header>

    <main>

        <section
            id="vehicle-form-section"
            class="hidden"
        >

            <h2>Añadir vehículo</h2>

            <form id="vehicle-form">

                <label for="vehicle-brand">
                    Marca
                </label>

                <input
                    type="text"
                    id="vehicle-brand"
                    required
                >

                <label for="vehicle-model">
                    Modelo
                </label>

                <input
                    type="text"
                    id="vehicle-model"
                    required
                >

                <label for="vehicle-year">
                    Año
                </label>

                <input
                    type="number"
                    id="vehicle-year"
                    min="1900"
                    required
                >

                <label for="vehicle-license-plate">
                    Matrícula
                </label>

                <input
                    type="text"
                    id="vehicle-license-plate"
                    required
                >

                <label for="vehicle-kilometers">
                    Kilómetros
                </label>

                <input
                    type="number"
                    id="vehicle-kilometers"
                    min="0"
                    required
                >

                <div class="form-actions">

                    <button type="submit">
                        Guardar vehículo
                    </button>

                    <button
                        type="button"
                        onclick="closeVehicleForm()"
                    >
                        Cancelar
                    </button>

                </div>

            </form>

        </section>


        <section
            id="edit-vehicle-form-section"
            class="hidden"
        >

            <h2>Editar vehículo</h2>

            <form id="edit-vehicle-form">

                <input
                    type="hidden"
                    id="edit-vehicle-id"
                >

                <label for="edit-vehicle-brand">
                    Marca
                </label>

                <input
                    type="text"
                    id="edit-vehicle-brand"
                    required
                >

                <label for="edit-vehicle-model">
                    Modelo
                </label>

                <input
                    type="text"
                    id="edit-vehicle-model"
                    required
                >

                <label for="edit-vehicle-year">
                    Año
                </label>

                <input
                    type="number"
                    id="edit-vehicle-year"
                    min="1900"
                    required
                >

                <label for="edit-vehicle-license-plate">
                    Matrícula
                </label>

                <input
                    type="text"
                    id="edit-vehicle-license-plate"
                    required
                >

                <label for="edit-vehicle-kilometers">
                    Kilómetros
                </label>

                <input
                    type="number"
                    id="edit-vehicle-kilometers"
                    min="0"
                    required
                >

                <div class="form-actions">

                    <button type="submit">
                        Guardar cambios
                    </button>

                    <button
                        type="button"
                        onclick="closeEditVehicleForm()"
                    >
                        Cancelar
                    </button>

                </div>

            </form>

        </section>


        <section>

            <div class="section-header">

                <h2>Vehículos</h2>

                <button
                    type="button"
                    onclick="openVehicleForm()"
                >
                    Añadir vehículo
                </button>

            </div>

            <div id="vehicles-container">
                <p>Cargando vehículos...</p>
            </div>

        </section>


        <section
            id="maintenance-form-section"
            class="hidden"
        >

            <h2>Añadir mantenimiento</h2>

            <form id="maintenance-form">

                <input
                    type="hidden"
                    id="maintenance-vehicle-id"
                >

                <label for="maintenance-type">
                    Tipo de mantenimiento
                </label>

                <input
                    type="text"
                    id="maintenance-type"
                    required
                >

                <label for="maintenance-date">
                    Fecha
                </label>

                <input
                    type="text"
                    id="maintenance-date"
                    placeholder="10/08/2026"
                    required
                >

                <label for="maintenance-kilometers">
                    Kilómetros
                </label>

                <input
                    type="number"
                    id="maintenance-kilometers"
                    min="0"
                    required
                >

                <label for="maintenance-cost">
                    Coste (€)
                </label>

                <input
                    type="number"
                    id="maintenance-cost"
                    min="0"
                    step="0.01"
                    required
                >

                <label for="maintenance-notes">
                    Notas
                </label>

                <textarea
                    id="maintenance-notes"
                    rows="4"
                ></textarea>

                <div class="form-actions">

                    <button type="submit">
                        Guardar mantenimiento
                    </button>

                    <button
                        type="button"
                        onclick="closeMaintenanceForm()"
                    >
                        Cancelar
                    </button>

                </div>

            </form>

        </section>


        <section
            id="edit-maintenance-form-section"
            class="hidden"
        >

            <h2>Editar mantenimiento</h2>

            <form id="edit-maintenance-form">

                <input
                    type="hidden"
                    id="edit-maintenance-id"
                >

                <input
                    type="hidden"
                    id="edit-maintenance-vehicle-id"
                >

                <label for="edit-maintenance-type">
                    Tipo de mantenimiento
                </label>

                <input
                    type="text"
                    id="edit-maintenance-type"
                    required
                >

                <label for="edit-maintenance-date">
                    Fecha
                </label>

                <input
                    type="text"
                    id="edit-maintenance-date"
                    required
                >

                <label for="edit-maintenance-kilometers">
                    Kilómetros
                </label>

                <input
                    type="number"
                    id="edit-maintenance-kilometers"
                    min="0"
                    required
                >

                <label for="edit-maintenance-cost">
                    Coste (€)
                </label>

                <input
                    type="number"
                    id="edit-maintenance-cost"
                    min="0"
                    step="0.01"
                    required
                >

                <label for="edit-maintenance-notes">
                    Notas
                </label>

                <textarea
                    id="edit-maintenance-notes"
                    rows="4"
                ></textarea>

                <div class="form-actions">

                    <button type="submit">
                        Guardar cambios
                    </button>

                    <button
                        type="button"
                        onclick="closeEditMaintenanceForm()"
                    >
                        Cancelar
                    </button>

                </div>

            </form>

        </section>


        <section
            id="maintenances-section"
            class="hidden"
        >

            <div class="section-header">

                <h2>Mantenimientos</h2>

            </div>

            <div id="maintenances-container">
            </div>

        </section>

    </main>

    <script src="app.js"></script>

</body>

</html>
